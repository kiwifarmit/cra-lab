name: Scheduled Security Scan

on:
  schedule:
    # Every Monday 03:00 UTC — CRA Annex I Part II 2.3 requires
    # "effective and regular" security testing, not just PRs.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================================
  # Full-repo vulnerability + misconfig + license scan.
  # Fail-closed on any CRITICAL/HIGH finding.
  # ==========================================================

  trivy-full:
    name: Trivy full repo scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,license
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-full.sarif
          exit-code: '1'

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-full
          path: trivy-full.sarif
          retention-days: 30
          if-no-files-found: warn

  # ==========================================================
  # Full SAST scan on the default branch.
  # ==========================================================

  semgrep-full:
    name: Semgrep full scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep==1.176.0

      - name: Run Semgrep scan
        run: semgrep scan --config auto --metrics off --sarif --output semgrep-full.sarif .

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-full
          path: semgrep-full.sarif
          retention-days: 30
          if-no-files-found: warn

  # ==========================================================
  # Secret scan across full git history.
  # ==========================================================

  gitleaks-full:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ==========================================================
  # SBOM drift check — CRA Annex I Part II 2.1 requires the SBOM
  # to be maintained. Regenerate it and compare the component
  # list against the committed sbom.json. Fails if they diverge.
  # ==========================================================

  sbom-verify:
    name: SBOM drift check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Regenerate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: current-sbom.json
          artifact-name: current-sbom
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false

      - name: Compare with committed SBOM
        run: |
          set -euo pipefail
          jq -S '.components' sbom.json > committed-components.json
          jq -S '.components' current-sbom.json > current-components.json
          if diff -u committed-components.json current-components.json; then
            echo "SBOM is up to date."
          else
            echo "::error::SBOM drift detected — commit an updated sbom.json (syft scan dir:. -o cyclonedx-json > sbom.json)."
            exit 1
          fi

  # ==========================================================
  # Collect all scan artifacts into a single report for audit
  # and retention (technical documentation, Annex VII).
  # ==========================================================

  report:
    name: Collect scan report
    runs-on: ubuntu-latest

    needs:
      - trivy-full
      - semgrep-full
      - gitleaks-full
      - sbom-verify

    if: always()

    permissions:
      contents: read
      actions: read

    steps:
      - name: Download all scan results
        uses: actions/download-artifact@v4
        with:
          path: reports
          merge-multiple: true

      - name: Build report index
        run: |
          set -euo pipefail
          {
            echo "# Scheduled Security Scan report"
            echo ""
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Commit: ${{ github.sha }}"
            echo ""
            echo "## Scan artifacts"
            echo ""
            if compgen -G "reports/*" >/dev/null; then
              ls -1 reports/
            else
              echo "(no artifacts uploaded)"
            fi
          } > report.md

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: report.md
          retention-days: 90