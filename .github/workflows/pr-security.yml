name: PR Security

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # SAST
  # ==========================================================
codeql:
  name: CodeQL
  runs-on: ubuntu-latest

  permissions:
    contents: read

  strategy:
    fail-fast: false
    matrix:
      language:
        - javascript

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Analyze
      uses: github/codeql-action/analyze@v4
      with:
        upload: false
        output: codeql-results

    - name: Upload SARIF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results
        path: codeql-results

  # ==========================================================
  # Dependency review
  # ==========================================================

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ==========================================================
  # Secret scanning supplement
  # ==========================================================

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: >
            --only-verified

  # ==========================================================
  # IaC scan
  # ==========================================================

  iac-security:
    name: IaC Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: false

  # ==========================================================
  # Policy gate
  # ==========================================================

  security-gate:
    name: PR Security Gate
    runs-on: ubuntu-latest

    needs:
      - codeql
      - dependency-review
      - secret-scan
      - iac-security

    steps:
      - name: Security gate
        run: |
          echo "All PR security checks passed."
